version: '3.3'
services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://dita:dita_pass@db:5432/elections
      - JWT_SECRET=change_this_secret
    depends_on:
      - db
  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=dita
      - POSTGRES_PASSWORD=dita_pass
      - POSTGRES_DB=elections
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
